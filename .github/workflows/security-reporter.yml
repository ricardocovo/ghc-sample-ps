name: Security Reporter

on:
  workflow_dispatch:

jobs:
  report:
    name: Generate and Upload Security Report
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm i -g @github/copilot

      - name: Run Security Reporter Agent via Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN}}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PROMPT=$'\n\nContext:\n'
          PROMPT+="- Repository: $GITHUB_REPOSITORY"
          PROMPT+=$'\n\nTask:\n'
          PROMPT+=$"\n- Generate Security report"

          copilot --agent Security-reporter --prompt "$PROMPT" --allow-all-tools --allow-all-paths < /dev/null

      - name: Upload  report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security-reports-${{ github.run_id }}
          path: Security_Reporter_Output.md
          retention-days: 30

      - name: Check for report
        if: always()
        run: |
          set -euo pipefail
          REPORT_PATTERN="Security_Reporter_Output.md"

          if ! compgen -G "$REPORT_PATTERN" > /dev/null; then
              echo "❌ NO REPORT GENERATED - Check workflow logs for errors"
              exit 1
          fi

          if grep -q "DOCUMENTATION-NEEDS-WORK" $REPORT_PATTERN; then
            echo "❌ MISSING OR INCOMPLETE DOCUMENTATION - Workflow failed"
            exit 1
          else
            echo "✅ Documentation is ok"
          fi
