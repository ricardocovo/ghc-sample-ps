name: Documentation Reporter

on:
  workflow_dispatch:

jobs:
  report:
    name: Generate and Upload Documentation Report
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm i -g @github/copilot

      - name: Run Security Agent via Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN}}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PROMPT=$'\n\nContext:\n'
          PROMPT+="- Repository: $GITHUB_REPOSITORY"
          PROMPT+=$'\n\nTask:\n'
          PROMPT+=$"\n- Generate documentation report"

          copilot --agent documentation-reporter --prompt "$PROMPT" --allow-all-tools --allow-all-paths < /dev/null

      - name: Check forreport
        if: always()
        run: |
          set -euo pipefail
          REPORT_PATH="documentation-report.md"

          if [ ! -f "$REPORT_PATH" ]; then
            echo "No report generated; skipping check."
            exit 0
          fi

          if grep -q "DOCUMENTATION IS NOT UP TO DATE." "$REPORT_PATH"; then
            echo "❌ MISSING DOCUMENTATION - Workflow failed"
            exit 1
          else
            echo "✅ Documentation is up to date"
          fi
